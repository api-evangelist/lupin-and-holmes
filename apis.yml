name: Lupin & Holmes
description: Lupin & Holmes is an offensive-security and social-engineering research
  firm that blends adversarial creativity with rigorous logic to strengthen defensive
  security practices. Its flagship product, Depi, is a proactive cybersecurity dashboard
  for software supply-chain protection, giving security teams real-time visibility
  into dependency vulnerabilities, patch tracking, and risk response. The company
  also publishes hands-on security research covering supply-chain attacks, dependency
  confusion, and CI/CD exploitation. It was surfaced as a portfolio company of Seedcamp
  and added to the API Evangelist network.
